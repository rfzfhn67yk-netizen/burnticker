<!doctype html>
<html><head><meta charset="utf-8"><title>B4 avatar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:wght@700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=block" rel="stylesheet">
<link rel="stylesheet" href="ledger.css">
<style>
  html,body{margin:0;width:800px;height:800px;overflow:hidden;background:var(--dark)}
  body{position:relative}
  .sheet{position:absolute;inset:0;overflow:hidden}
  .ros{position:absolute;left:0;top:0}
  .wm{position:absolute;left:0;right:0;top:640px;text-align:center;font-size:54px;letter-spacing:12px;line-height:1}
  .sub{position:absolute;left:0;right:0;top:708px;text-align:center;font-size:19px;letter-spacing:5px;color:#4d5f59;font-family:'Playfair Display SC',serif;font-weight:700}
  .no{position:absolute;left:92px;top:88px;font-size:24px;letter-spacing:2px}
  .no b{font-weight:400;color:var(--gold)}
</style></head>
<body>
<div class="sheet" id="sheet">
  <div class="paper"></div>
  <svg class="grain" width="800" height="800"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/></filter><rect width="800" height="800" filter="url(#g)"/></svg>
  <div class="frame" style="left:28px;top:28px;right:28px;height:22px"></div>
  <div class="frame" style="left:28px;bottom:28px;right:28px;height:22px"></div>
  <div class="frame hz" style="left:28px;top:28px;bottom:28px;width:22px"></div>
  <div class="frame hz" style="right:28px;top:28px;bottom:28px;width:22px"></div>
  <div class="hair" style="left:58px;top:58px;right:58px;bottom:58px"></div>
  <svg class="ros" id="ros" width="800" height="800" viewBox="0 0 800 800"></svg>
  <div class="cartouche" style="left:258px;top:272px;width:236px;height:160px"><span style="font-size:124px;padding-bottom:6px">B</span></div>
  <div class="no num">N<span style="font-size:16px;vertical-align:top">o</span> <b>0001</b></div>
  <div class="wm sc">Burnticker</div>
  <div class="sub">Event-indexed supply · with receipts</div>
</div>
<!-- the sheet's corner is burned away: charred edge, then the dark behind -->
<svg class="burn" width="800" height="800" viewBox="0 0 800 800" style="left:0;top:0">
  <defs>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="4" seed="4" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="40"/></filter>
    <radialGradient id="scorch" cx="100%" cy="100%" r="100%"><stop offset="0" stop-color="#0f1a17"/><stop offset=".55" stop-color="#0f1a17"/><stop offset=".60" stop-color="#1a110a"/><stop offset=".68" stop-color="#4a2c12"/><stop offset=".78" stop-color="#9a6b2e" stop-opacity=".8"/><stop offset=".88" stop-color="#cdb27a" stop-opacity=".45"/><stop offset="1" stop-color="#e9e9df" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="792" cy="792" r="270" fill="url(#scorch)" filter="url(#rough)"/>
</svg>
<script src="guilloche.js"></script>
<script>rosette(document.getElementById('ros'),376,352,270);</script>
</body></html>
