  <text x="80" y="172" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#b8b8c4">Every $1,000,000,000 the U.S. borrows burns 0.01% of supply. Bought back with trading fees and burned. With a receipt.</text>
