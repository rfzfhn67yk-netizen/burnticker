[package]
name = "pair_curve"
version = "0.1.0"
description = "Burnticker pair curve: two coins on two virtual-reserve bonding curves in one account; both graduate to Raydium CPMM pools together (LP locked forever, its fees fund the burn) or the pair voids and every holder redeems pro rata. No admin, no withdraw path."
edition.workspace = true
rust-version.workspace = true
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "pair_curve"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Devnet build: Raydium's devnet CPMM / LaunchLab ids (taken from burn_receipts' own `devnet` constants — one source of truth).
devnet = ["burn_receipts/devnet"]
# The LiteSVM suite's build (scripts/test.sh → target/deploy-localnet): pins the harness's test LaunchLab platform as BURNTICKER_PLATFORM.
localnet = []

[dependencies]
anchor-lang = { version = "=1.2.1", features = ["init-if-needed", "event-cpi"] }
anchor-spl = { version = "=1.2.1" }
# Read-only use: TokenConfig's layout (deserialised after an owner + PDA check), the shared constants (CPMM / LaunchLab ids, seeds,
# LaunchLab PlatformConfig offsets) and the CPMM PoolState reader. pair_curve never CPIs into burn_receipts.
burn_receipts = { path = "../burn_receipts", features = ["no-entrypoint"] }

[dev-dependencies]
litesvm = { version = "0.17.0", features = ["precompiles"] }
solana-message = "4.6.0"
solana-transaction = "4.3.0"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
serde_json = "1"
solana-account = "4.7.0"
sha2 = "0.10"
solana-instructions-sysvar = "3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
