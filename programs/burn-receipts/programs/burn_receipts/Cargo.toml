[package]
name = "burn_receipts"
version = "0.1.0"
description = "Receipts: event-indexed burns. An attested public reading (Treasury Debt to the Penny for $DEFICIT) sets the units; a permissionless crank buys the token on its Raydium CPMM pool with the creator-fee SOL and burns everything received (or burns from a program-owned vault). No withdraw instruction exists."
edition.workspace = true
rust-version.workspace = true
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "burn_receipts"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Point the hard-coded Raydium CPMM program id at Raydium's devnet deployment (DRaycpLY…) instead of mainnet (CPMMoo8L…).
devnet = []
# Review-3 I-1: local-validator rehearsals bind their own genesis tag in the signed message (never mainnet's).
localnet = []

[dependencies]
anchor-lang = { version = "=1.2.1", features = ["init-if-needed", "event-cpi"] }
anchor-spl = { version = "=1.2.1" }
solana-instructions-sysvar = "3.0.1"
solana-sha256-hasher = "3.1.0"

[dev-dependencies]
litesvm = { version = "0.17.0", features = ["precompiles"] }
solana-message = "4.6.0"
solana-transaction = "4.3.0"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
serde_json = "1"
solana-account = "4.7.0"
sha2 = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
